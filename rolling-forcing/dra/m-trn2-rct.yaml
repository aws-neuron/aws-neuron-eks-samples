# ResourceClaimTemplate: Medium Trainium2 (2 Neuron devices, 2 logical NeuronCores each)
# Use case: tensor-parallel inference (TP=4) on trn2.48xlarge
apiVersion: resource.k8s.io/v1beta1
kind: ResourceClaimTemplate
metadata:
  name: m-trn2
spec:
  spec:
    devices:
      constraints:
      - matchAttribute: resource.aws.com/devicegroup4_id
        requests:
        - neurons
      requests:
      - allocationMode: ExactCount
        count: 2
        deviceClassName: neuron.aws.com
        name: neurons
        selectors:
        - cel:
            expression: device.attributes['neuron.aws.com'].instanceType == 'trn2.48xlarge'
      config:
      - requests: ["neurons"]
        opaque:
          driver: neuron.aws.com
          parameters:
            apiVersion: neuron.aws.com/v1
            kind: NeuronConfig
            logicalNeuronCore: 2
