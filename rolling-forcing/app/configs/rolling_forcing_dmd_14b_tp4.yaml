# Wan2.1-T2V-14B with Tensor Parallelism (TP=4) on Trainium
# All 4 NeuronCores assigned to DiT (performance bottleneck)
# TE and VAE replicated on each rank for high utilization

model_name: Wan2.1-T2V-14B
tp_degree: 4

# 14B model architecture (from HF config)
# dim: 5120, num_heads: 40, num_layers: 40, ffn_dim: 13824
# head_dim: 128, text_dim: 4096, freq_dim: 256

generator_ckpt: checkpoints/ode_init.pt
real_name: Wan2.1-T2V-14B

denoising_step_list:
- 1000
- 800
- 600
- 400
- 200
warp_denoising_step: true
ts_schedule: false
num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 3.0
denoising_loss_type: flow
mixed_precision: true
seed: 0
batch_size: 1

negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'

image_or_video_shape:
- 1
- 21
- 16
- 60
- 104

num_frame_per_block: 3
model_kwargs:
  timestep_shift: 5.0
