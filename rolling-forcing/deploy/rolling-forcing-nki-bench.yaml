apiVersion: batch/v1
kind: Job
metadata:
  name: rolling-forcing-nki
  namespace: default
  labels:
    benchmark: nki-vs-no-nki
    variant: nki-true
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: rolling-forcing-nki
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn2
      resourceClaims:
        - name: s-lnc2-trn2
          resourceClaimTemplateName: s-lnc2-trn2
      containers:
        - name: inference
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euxo pipefail

              git clone -b rolling-forcing https://yahavb:${GITHUB_TOKEN}@github.com/aws-neuron/aws-neuron-eks-samples.git
              cd aws-neuron-eks-samples/rolling-forcing/app
              export RF_DEVICE_BACKEND=neuron

              # Install dependencies
              uv pip install -r requirements.txt
              uv pip install "setuptools<81"
              uv pip install git+https://github.com/pytorch/vision.git@v0.25.0 --no-deps --no-cache --no-build-isolation

              # /var/mdl is S3-backed. Use single tar file to avoid per-file S3 overhead
              WAN_1_3B_TAR="/var/mdl/wan_models/Wan2.1-T2V-1.3B.tar"

              # Copy Wan 1.3B model as single tar from S3 cache to local disk
              mkdir -p wan_models
              if [[ -f "$WAN_1_3B_TAR" ]]; then
                echo "Copying Wan 1.3B tar from S3 cache..."
                cp "$WAN_1_3B_TAR" /tmp/Wan2.1-T2V-1.3B.tar
                echo "Extracting..."
                tar xf /tmp/Wan2.1-T2V-1.3B.tar -C wan_models/
                rm -f /tmp/Wan2.1-T2V-1.3B.tar
                echo "Done!"
              else
                echo "Downloading Wan 1.3B model from HuggingFace to local disk..."
                python3 -c "from huggingface_hub import snapshot_download; snapshot_download('Wan-AI/Wan2.1-T2V-1.3B', local_dir='wan_models/Wan2.1-T2V-1.3B', local_dir_use_symlinks=False)"
                echo "Creating tar archive for S3 cache (avoids per-file overhead next time)..."
                tar cf /tmp/Wan2.1-T2V-1.3B.tar -C wan_models Wan2.1-T2V-1.3B
                mkdir -p "$(dirname $WAN_1_3B_TAR)"
                cp /tmp/Wan2.1-T2V-1.3B.tar "$WAN_1_3B_TAR"
                rm -f /tmp/Wan2.1-T2V-1.3B.tar
                echo "Cached tar to S3!"
              fi

              echo "Model weights ready!"

              # Copy RollingForcing DMD checkpoint from S3 cache to local disk
              RF_CACHE="/var/mdl/checkpoints/rolling_forcing_dmd.pt"
              mkdir -p checkpoints
              if [[ -f "$RF_CACHE" ]]; then
                echo "Copying RollingForcing checkpoint from S3 cache to local disk..."
                cp "$RF_CACHE" checkpoints/rolling_forcing_dmd.pt
                echo "Copy complete!"
              else
                echo "Downloading RollingForcing checkpoint from HuggingFace to local disk..."
                python3 -c "from huggingface_hub import hf_hub_download; hf_hub_download('TencentARC/RollingForcing', 'checkpoints/rolling_forcing_dmd.pt', local_dir='.')"
                echo "Caching to S3 for next time..."
                mkdir -p "$(dirname $RF_CACHE)"
                cp checkpoints/rolling_forcing_dmd.pt "$RF_CACHE"
              fi

              # ========================================
              # Profiling: capture neuron device traces
              # ========================================
              export NEURON_RT_INSPECT_ENABLE=1
              export NEURON_RT_INSPECT_OUTPUT_DIR=/tmp/neuron_profile
              export NEURON_RT_INSPECT_DEVICE_PROFILE=session
              mkdir -p /tmp/neuron_profile
              echo "============================================"
              echo "  A/B BENCHMARK: NKI=TRUE (with NKI kernels)"
              echo "  Profiling: ENABLED"
              echo "============================================"

              # Launch benchmark: warmup (cat) + 3x measurement (skateboard)
              export REPO_DIR=$(pwd)
              torchrun --nproc_per_node=4 --master_port=29500 \
                inference_neuron_tp.py --benchmark 2>&1

              # ========================================
              # Find the LOCAL run directory
              # ========================================
              RUN_DIR=$(find /tmp -maxdepth 1 -name "rf_run_*" -type d | sort | tail -1)
              if [[ -z "$RUN_DIR" ]]; then
                echo "WARNING: No local run directory found — using fallback"
                RUN_DIR="/tmp/rf_run_$(date +%Y%m%d_%H%M%S)"
                mkdir -p "$RUN_DIR/frames"
              fi
              TIMESTAMP=$(basename "$RUN_DIR" | sed 's/rf_run_//')
              echo "Local run directory: $RUN_DIR (timestamp: $TIMESTAMP)"

              # ========================================
              # Stitch last run's PNGs into mp4
              # ========================================
              apt-get update -qq && apt-get install -y -qq ffmpeg > /dev/null 2>&1 || true
              FRAMES_DIR="$RUN_DIR/frames"
              VIDEO_OUT="$RUN_DIR/output.mp4"
              if [[ -d "$FRAMES_DIR" && -n "$(ls $FRAMES_DIR/frame_*.png 2>/dev/null | head -1)" ]]; then
                FRAME_COUNT=$(ls $FRAMES_DIR/frame_*.png | wc -l)
                echo "Stitching $FRAME_COUNT frames into video: $VIDEO_OUT"
                ffmpeg -y -framerate 16 -i "$FRAMES_DIR/frame_%04d.png" \
                  -c:v libx264 -pix_fmt yuv420p -crf 18 "$VIDEO_OUT" 2>&1 || \
                  echo "WARNING: ffmpeg stitch failed (frames still available as PNGs)"
                if [[ -f "$VIDEO_OUT" ]]; then
                  echo "Video saved: $VIDEO_OUT ($(du -sh $VIDEO_OUT | cut -f1))"
                fi
              else
                echo "No frames found in $FRAMES_DIR — skipping video stitch"
              fi

              # ========================================
              # Copy profile artifacts into run directory
              # ========================================
              PROFILE_DEST="$RUN_DIR/profiles"
              mkdir -p "$PROFILE_DEST"
              if [[ -d /tmp/neuron_profile && -n "$(ls -A /tmp/neuron_profile 2>/dev/null)" ]]; then
                cp -r /tmp/neuron_profile/* "$PROFILE_DEST/"
                echo "Profile artifacts saved to $PROFILE_DEST"
              fi

              # ========================================
              # Neuron Explorer: summary + NEFF analysis
              # ========================================
              NTFF_DIR=$(find "$PROFILE_DEST" -mindepth 2 -maxdepth 2 -type d 2>/dev/null | head -1)
              if [[ -n "$NTFF_DIR" ]]; then
                echo ""
                echo "============================================"
                echo "  NEURON EXPLORER ANALYSIS"
                echo "============================================"

                # Summary
                echo "=== neuron-explorer summary ==="
                neuron-explorer summary -d "$NTFF_DIR" 2>&1 | tee "$RUN_DIR/neuron_explorer_summary.txt"

                # JSON view (skip DMA trace to keep output manageable)
                echo ""
                echo "=== neuron-explorer view (JSON, skip DMA) ==="
                neuron-explorer view -d "$NTFF_DIR" \
                  --output-format json \
                  --output-file "$RUN_DIR/neuron_explorer_profile.json" \
                  --ignore-dma-trace 2>&1 | tee "$RUN_DIR/neuron_explorer_view.log"

                # NEFF distribution
                echo ""
                echo "=== NEFF COUNT AND SIZE DISTRIBUTION ==="
                NEFF_COUNT=$(find "$NTFF_DIR" -name '*.neff' | wc -l)
                echo "Total NEFFs: $NEFF_COUNT"
                find "$NTFF_DIR" -name '*.neff' -exec ls -l '{}' ';' | awk '{print $5}' | sort -n | awk '
                  BEGIN { count=0; sum=0 }
                  { sizes[count++]=$1; sum+=$1 }
                  END {
                    if (count == 0) { print "No NEFFs found"; exit }
                    printf "Total size: %.2f MB\n", sum/1024/1024
                    printf "Min: %d bytes\n", sizes[0]
                    printf "Max: %d bytes (%.2f MB)\n", sizes[count-1], sizes[count-1]/1024/1024
                    printf "Median: %d bytes\n", sizes[int(count/2)]
                    printf "Mean: %.0f bytes\n", sum/count
                    printf "\nSize buckets:\n"
                    small=0; med=0; large=0; xlarge=0
                    for(i=0;i<count;i++) {
                      if(sizes[i]<10000) small++
                      else if(sizes[i]<100000) med++
                      else if(sizes[i]<1000000) large++
                      else xlarge++
                    }
                    printf "  <10KB  (tiny):   %d\n", small
                    printf "  10-100KB (small): %d\n", med
                    printf "  100KB-1MB (med):  %d\n", large
                    printf "  >1MB  (large):    %d\n", xlarge
                  }' | tee -a "$RUN_DIR/neuron_explorer_summary.txt"
              else
                echo "WARNING: No profile directory found for neuron-explorer"
              fi

              # ========================================
              # ARCHIVE: Copy to S3 persistent storage
              # Tag with "nki_" prefix for easy identification
              # ========================================
              ARCHIVE_DIR="/var/mdl/rolling_forcing/runs/nki_${TIMESTAMP}"
              echo ""
              echo "============================================"
              echo "  ARCHIVING to S3: $ARCHIVE_DIR"
              echo "============================================"
              mkdir -p "$ARCHIVE_DIR"
              # Save video + benchmark + neuron-explorer results
              cp "$RUN_DIR/benchmark.json" "$ARCHIVE_DIR/" 2>/dev/null || true
              cp "$RUN_DIR/output.mp4" "$ARCHIVE_DIR/" 2>/dev/null || true
              cp "$RUN_DIR/neuron_explorer_summary.txt" "$ARCHIVE_DIR/" 2>/dev/null || true
              cp "$RUN_DIR/neuron_explorer_profile.json" "$ARCHIVE_DIR/" 2>/dev/null || true
              cp "$RUN_DIR/neuron_explorer_view.log" "$ARCHIVE_DIR/" 2>/dev/null || true
              cp -r "$PROFILE_DEST" "$ARCHIVE_DIR/profiles" 2>/dev/null || true
              echo "Archive complete!"
              ls -la "$ARCHIVE_DIR/" 2>/dev/null || true
          resources:
            claims:
              - name: s-lnc2-trn2
            requests:
              cpu: 44
              memory: 440Gi
            limits:
              cpu: 44
              memory: 440Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: TORCH_NEURONX_LOG_LEVEL
              value: "ERROR"
            - name: RF_DEVICE_BACKEND
              value: "neuron"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "2"
            - name: NEURON_RT_DBG_INTRA_RDH_CHANNEL_BUFFER_SIZE
              value: "134217728"
            - name: NEURON_CC_FLAGS
              value: "--model-type=transformer"
            # *** A/B TEST: NKI KERNELS ENABLED ***
            - name: USE_NKI_KERNELS
              value: "true"
            - name: USE_NEFF_CACHE
              value: "false"
            - name: BENCHMARK_RUNS
              value: "3"
            - name: CONFIG_PATH
              value: "configs/default_config.yaml"
            - name: MODEL_PATH
              value: "wan_models/Wan2.1-T2V-1.3B"
            - name: VAE_PATH
              value: "wan_models/Wan2.1-T2V-1.3B/Wan2.1_VAE.pth"
            - name: CHECKPOINT_PATH
              value: "checkpoints/rolling_forcing_dmd.pt"
            - name: DEFAULT_NUM_FRAMES
              value: "161"
            - name: DEFAULT_FPS
              value: "16"
            - name: TP_DEGREE
              value: "4"
            - name: VAE_TP_DEGREE
              value: "1"
            - name: T5_RANK
              value: "2"
            - name: DEVICE
              value: "neuron"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
